type: hylf
render:
  type: hylf
param:
  n_dims: 6
  fn: identity
embedding:
  type: hybrid_ray
  embeddings:
    hybrid_ray_predictor:
      type: hybrid_ray_predictor
      params:
        ray:
          start: 0
          end: 6
          param:
            n_dims: 4
            fn: two_plane
          pe:
            type: windowed
            freq_multiplier: 2.0
            n_freqs: 1
            wait_iters: 0
            max_freq_epoch: 0
            exclude_identity: False
      net:
        type: feature_mlp
        group: embedding_impl
        depth: 6
        hidden_channels: 256
        skips: [3]
      z_channels: 32
      outputs:
        z_vals:
          channels: 1
        sigma:
          channels: 1
          activation:
            type: ease_value
            start_value: 1.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: sigmoid
              shift: 4.0
        point_sigma:
          channels: 1
          activation:
            type: ease_value
            start_value: 1.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: sigmoid
              shift: 4.0
        point_offset:
          channels: 3
          activation:
            type: tanh
            outer_fac: 0.25
        color_scale:
          channels: 3
          activation:
            type: ease_value
            start_value: 0.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: identity
              shift: 0.0
              inner_fac: 1.0
              outer_fac: 1.0
        color_shift:
          channels: 3
          activation:
            type: ease_value
            start_value: 0.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: identity
              shift: 0.0
              inner_fac: 1.0
              outer_fac: 1.0
        angular_flow:
          channels: 6
          activation:
            type: identity
            outer_fac: 0.25
    planar_intersection:
      type: planar_ray_intersection
      z_channels: 32
      intersect:
        type: parallel_planes
        in_density_field: sigma
        initial: -0.65
        end: 1.0
        activation:
          type: identity
          fac: 0.5
    point_offset:
      type: hybrid_point_offset
      in_density_field: point_sigma
    output_fields:
      type: field_extractor
      fields: ['points', 'distances', 'weights', 'color_scale', 'color_shift', 'rays']
color:
  net:
    type: planar_voxel_grid
    white_background: False
    black_background: False
    distance_scale: 8.0
    aabb: [[-2.0, -2.0, -1.0], [2.0, 2.0, 2.0]]
    initial_voxel_count: 2097152
    final_voxel_count: 512000000
    upsample_iters: [4000,6000,8000,10000,12000]
    occupancy_update_iters: [4000,8000]
    render_weight_threshold: 0
    occupancy_threshold: 1e-3
    density_components: [8,0,0]
    appearance_components: [8,0,0]
    appearance_feature_channels: 3
