# Planar neural voxel ablation: replace the PNV decoder with an RGB MLP.
type: hylf
render:
  type: hylf
param:
  n_dims: 6
  fn: identity
embedding:
  type: hybrid_ray
  embeddings:
    hybrid_ray_predictor:
      type: hybrid_ray_predictor
      params:
        ray:
          start: 0
          end: 6
          param:
            n_dims: 4
            fn: two_plane
          pe:
            type: windowed
            freq_multiplier: 2.0
            n_freqs: 1
            wait_iters: 0
            max_freq_epoch: 0
            exclude_identity: False
      net:
        type: feature_mlp
        group: embedding_impl
        depth: 6
        hidden_channels: 256
        skips: [3]
      z_channels: 32
      outputs:
        z_vals:
          channels: 1
        sigma:
          channels: 1
          activation:
            type: ease_value
            start_value: 1.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: sigmoid
              shift: 4.0
        point_sigma:
          channels: 1
          activation:
            type: ease_value
            start_value: 1.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: sigmoid
              shift: 4.0
        point_offset:
          channels: 3
          activation:
            type: tanh
            outer_fac: 0.25
        color_scale:
          channels: 3
          activation:
            type: ease_value
            start_value: 0.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: identity
              shift: 0.0
              inner_fac: 1.0
              outer_fac: 1.0
        color_shift:
          channels: 3
          activation:
            type: ease_value
            start_value: 0.0
            window_epochs: 0
            wait_epochs: 0
            activation:
              type: identity
              shift: 0.0
              inner_fac: 1.0
              outer_fac: 1.0
    planar_intersection:
      type: planar_ray_intersection
      z_channels: 32
      intersect:
        type: parallel_planes
        in_density_field: sigma
        initial: -0.65
        end: 1.0
        activation:
          type: identity
          fac: 0.5
    point_offset:
      type: hybrid_point_offset
      in_density_field: point_sigma
    output_fields:
      type: field_extractor
      fields: ['points', 'distances', 'weights', 'color_scale', 'color_shift', 'rays']
color:
  net:
    type: rgb_decoder_mlp
    depth: 6
    hidden_channels: 256
    skips: [3]
    layer_activation:
      type: leaky_relu
      sigma: 0.25
    activation: sigmoid
